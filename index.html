<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Stock de Empanadas</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .item span {
            font-weight: bold;
            color: #444;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            opacity: 0.9;
        }
        button.btn-minus {
            background-color: #dc3545;
        }
        input[type="number"] {
            width: 50px;
            text-align: center;
            font-size: 16px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #auth-screen {
            text-align: center;
        }
        #auth-screen input {
            width: 80%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #auth-screen button {
            width: 85%;
            padding: 10px;
            background-color: #28a745;
        }
        .error-msg {
            color: #dc3545;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        #app-content {
            display: none;
        }
        .logout-container {
            text-align: right;
            margin-bottom: 15px;
        }
        .btn-logout {
            background-color: #6c757d;
            font-size: 12px;
            padding: 5px 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Pantalla de Autenticación -->
        <div id="auth-screen">
            <h2>Acceso Restringido</h2>
            <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Ingrese sus credenciales de administración.</p>
            <input type="email" id="auth-email" placeholder="Correo electrónico"><br>
            <input type="password" id="auth-password" placeholder="Contraseña"><br>
            <button onclick="iniciarSesion()">Ingresar</button>
            <div id="error-message" class="error-msg">Credenciales incorrectas</div>
        </div>

        <!-- Panel de Stock -->
        <div id="app-content">
            <div class="logout-container">
                <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
            <h2>Control de Stock de Empanadas</h2>
            <div id="stock-list">
                <!-- Se carga dinámicamente -->
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ixoqvlcjfrechpcrcwsq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_CBrkj8wJgFEfXDu2o0_zLQ_ZJ82urbE';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function iniciarSesion() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                document.getElementById('error-message').style.display = 'block';
                console.error(error);
            } else {
                document.getElementById('error-message').style.display = 'none';
                mostrarApp();
            }
        }

        async function cerrarSesion() {
            await supabaseClient.auth.signOut();
            location.reload();
        }

        function mostrarApp() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            cargarStock();
        }

        // Verificar si ya hay una sesión activa al cargar la página
        window.onload = async function() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                mostrarApp();
            }
        };

        async function cargarStock() {
            const { data, error } = await supabaseClient
                .from('stock_empanadas')
                .select('*')
                .order('id', { ascending: true });

            if (error) {
                console.error("Error al cargar stock:", error);
                return;
            }

            const container = document.getElementById('stock-list');
            container.innerHTML = '';

            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `
                    <span>${item.nombre}</span>
                    <div class="controls">
                        <button class="btn-minus" onclick="actualizarStock(${item.id}, ${item.cantidad - 1})">-</button>
                        <input type="number" id="qty-${item.id}" value="${item.cantidad}" readonly>
                        <button onclick="actualizarStock(${item.id}, ${item.cantidad + 1})">+</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        async function actualizarStock(id, nuevaCantidad) {
            if (nuevaCantidad < 0) nuevaCantidad = 0;

            const { error } = await supabaseClient
                .from('stock_empanadas')
                .update({ cantidad: nuevaCantidad })
                .eq('id', id);

            if (error) {
                alert('Error al actualizar el stock (Permiso denegado)');
                console.error(error);
            } else {
                cargarStock();
            }
        }
    </script>
</body>
</html>
